<body>
<div id="root"></div>
<noscript>This portfolio needs JavaScript. Email: kiran.kethavath97@gmail.com</noscript>
<style>
#uiux .cases .cs{padding:12px;gap:10px}
#uiux.sec{padding-top:clamp(48px,7vh,64px)}
#uiux .cases .vp{aspect-ratio:16/9}
@media (min-width:821px){#uiux .cases{grid-template-columns:repeat(3,minmax(0,1fr))}#uiux .cases .cs:last-child{grid-column:auto}}
.lb .pv:fullscreen{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;background:#080808}
.lb .fullscreen-toggle{position:absolute;z-index:4;top:12px;right:12px;display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid #555;border-radius:999px;background:rgba(17,17,17,.9);backdrop-filter:blur(8px);font-size:12px;font-weight:600;line-height:1.3;transition:background .2s,border-color .2s}
.lb .fullscreen-toggle:hover{background:var(--ac);border-color:var(--ac);color:#000}
.lb .fullscreen-toggle:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.lb .pv.long .fullscreen-toggle{position:sticky;top:10px;margin:10px 0 -46px auto}
.lb .fullscreen-error{position:absolute;z-index:4;top:58px;right:12px;max-width:calc(100% - 24px);padding:8px 12px;border:1px solid #555;border-radius:10px;background:#111;color:var(--ink);font-size:12px}
@media (max-width:820px){.lb .fullscreen-toggle{left:12px;right:auto}.lb .pv.long .fullscreen-toggle{margin:10px auto -46px 0}}
</style>
<script>
(() => {
  const installFullscreenControl = () => {
    document.querySelectorAll(".lb .pv").forEach((stage) => {
      if (stage.querySelector(".fullscreen-toggle")) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "fullscreen-toggle";
      button.setAttribute("aria-label", "View artwork full screen");
      button.innerHTML = '<span aria-hidden="true">&#x26F6;</span><span>Full screen</span>';
      button.addEventListener("click", async () => {
        try {
          if (document.fullscreenElement === stage) {
            await document.exitFullscreen();
          } else {
            if (document.fullscreenElement) await document.exitFullscreen();
            await stage.requestFullscreen();
          }
        } catch (error) {
          console.error("Unable to show artwork full screen.", error);
          let status = stage.querySelector(".fullscreen-error");
          if (!status) {
            status = document.createElement("span");
            status.className = "fullscreen-error";
            status.setAttribute("role", "status");
            button.after(status);
          }
          status.textContent = "Full screen is unavailable in this browser.";
        }
      });
      stage.prepend(button);
    });
  };

  const updateFullscreenControls = () => {
    document.querySelectorAll(".lb .pv").forEach((stage) => {
      const button = stage.querySelector(".fullscreen-toggle");
      if (!button) return;
      const active = document.fullscreenElement === stage;
      button.setAttribute("aria-label", active ? "Exit full screen" : "View artwork full screen");
      button.querySelector("span:last-child").textContent = active ? "Exit full screen" : "Full screen";
    });
  };

  new MutationObserver(installFullscreenControl).observe(document.body, { childList: true, subtree: true });
  document.addEventListener("fullscreenchange", updateFullscreenControls);
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape" || !document.fullscreenElement) return;
    event.stopImmediatePropagation();
    document.exitFullscreen().catch((error) => console.error("Unable to exit full screen.", error));
  }, true);
  installFullscreenControl();
})();
</script>
</body>
